<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #121316;
      --panel: #1c1e22;
      --panel-border: #2a2d32;
      --panel-2: #202226;
      --text: #f2f3f5;
      --text-dim: #9a9da3;
      --text-faint: #6b6e74;
      --accent: oklch(0.75 0.19 152);
      --accent-dim: oklch(0.24 0.05 152);
      --accent-text: oklch(0.16 0.03 152);
      --warn: oklch(0.78 0.17 85);
      --warn-dim: oklch(0.25 0.06 85);
      --danger: oklch(0.68 0.21 25);
      --danger-dim: oklch(0.26 0.08 25);
      --radius: 14px;
      --radius-sm: 9px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    a { color: var(--accent); } a:hover { color: oklch(0.82 0.19 152); }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width:820px; padding:16px; display:flex; flex-direction:column; gap:12px;">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div style="display:flex; align-items:baseline; gap:10px;">
      <span style="font-size:17px; font-weight:700; letter-spacing:0.2px;">PrintHost</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="display:flex; align-items:center; gap:6px; background:var(--accent-dim); color:var(--accent); border-radius:20px; padding:4px 12px 4px 10px; font-size:12px; font-weight:700;">
        <svg width="7" height="7" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>
        Connected
      </span>
      <span style="display:flex; align-items:center; gap:5px; color:var(--text-dim); font-size:12px; font-weight:600;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="16" height="10" rx="2"/>
          <path d="M19 10v4"/>
          <rect x="5.5" y="9.5" width="7" height="5" rx="1" fill="currentColor" stroke="none"/>
        </svg>
        <span class="num">92%</span>
      </span>
      <button style="background:var(--panel-2); color:var(--text); border:1px solid var(--panel-border); border-radius:var(--radius-sm); padding:8px 16px; font-size:12px; font-weight:700; cursor:pointer;">Disconnect</button>
    </div>
  </div>

  <!-- Main row: print status + camera -->
  <div style="display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap:12px; align-items:stretch;">

    <!-- Print status card: vertical stack (ring on top, centered) so it never fights the
         camera column for horizontal space regardless of how wide the stat pills get. -->
    <div style="background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius); padding:18px; display:flex; flex-direction:column; gap:12px; min-width:0;">

      <!-- Ring: percent only -->
      <svg width="118" height="118" viewBox="0 0 118 118" style="flex:none; align-self:center;">
        <circle cx="59" cy="59" r="50" fill="none" stroke="var(--panel-2)" stroke-width="9"/>
        <circle cx="59" cy="59" r="50" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"
                stroke-dasharray="314.2" stroke-dashoffset="113" transform="rotate(-90 59 59)"/>
        <text x="59" y="67" text-anchor="middle" font-size="25" font-weight="700" fill="var(--text)" class="num">64%</text>
      </svg>

      <!-- Time: vertical - elapsed on top, remaining below (labeled), centered in the pill -->
      <div style="background:var(--panel-2); border-radius:var(--radius-sm); padding:9px 13px; display:flex; align-items:center; justify-content:center; gap:10px; min-width:0; text-align:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
        </svg>
        <div style="min-width:0; line-height:1.3;">
          <div style="font-size:15px; font-weight:700;" class="num">1h 42m</div>
          <div style="font-size:12px; color:var(--text-faint);"><span class="num" style="color:var(--text-dim); font-weight:600;">54m</span> remaining</div>
        </div>
      </div>

      <!-- Temps -->
      <div style="display:flex; gap:8px;">
        <div style="flex:1; background:var(--panel-2); border-radius:var(--radius-sm); padding:9px 10px; display:flex; align-items:center; justify-content:center; gap:7px; min-width:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-dim)" style="flex:none;">
            <path d="M7.5 3h9v4.2l-2.3 4.3v8.3a1.2 1.2 0 0 1-1.2 1.2h-2a1.2 1.2 0 0 1-1.2-1.2v-8.3L7.5 7.2z"/>
          </svg>
          <div style="font-size:15px; font-weight:700; white-space:nowrap;" class="num">218&deg;<span style="color:var(--text-faint); font-weight:500; font-size:12px;">/220&deg;</span></div>
        </div>
        <div style="flex:1; background:var(--panel-2); border-radius:var(--radius-sm); padding:9px 10px; display:flex; align-items:center; justify-content:center; gap:7px; min-width:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:none;">
            <rect x="3" y="8" width="18" height="11" rx="1.5"/>
            <path d="M3 13.5h18M9 8v11M15 8v11"/>
          </svg>
          <div style="font-size:15px; font-weight:700; white-space:nowrap;" class="num">59&deg;<span style="color:var(--text-faint); font-weight:500; font-size:12px;">/60&deg;</span></div>
        </div>
      </div>

      <div style="background:var(--panel-2); border-radius:var(--radius-sm); padding:9px 12px;">
        <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Desk_Cable_Management_Hugger_Clip.gcode</div>
      </div>

      <!-- Controls: only the buttons relevant to the current state show at once -->
      <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:8px;">
        <button style="background:var(--warn-dim); color:var(--warn); border:none; border-radius:var(--radius-sm); padding:11px 0; font-size:12.5px; font-weight:700; cursor:pointer;">Pause</button>
        <button style="background:var(--danger-dim); color:var(--danger); border:none; border-radius:var(--radius-sm); padding:11px 0; font-size:12.5px; font-weight:700; cursor:pointer;">Stop</button>
      </div>

      <!-- Upload: lives at the bottom of this same card, not a separate row elsewhere -->
      <div style="border:1.5px dashed var(--panel-border); border-radius:var(--radius-sm); padding:9px 10px; display:flex; align-items:center; gap:9px; margin-top:2px;">
        <button style="background:var(--accent); color:var(--accent-text); border:none; border-radius:7px; padding:8px 13px; font-size:11.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; flex:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          Choose File
        </button>
        <span style="flex:1; min-width:0; font-size:11px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">No file selected</span>
        <button style="background:var(--panel-2); color:var(--text-faint); border:1px solid var(--panel-border); border-radius:7px; padding:8px 12px; font-size:11.5px; font-weight:700; cursor:not-allowed; flex:none;">Upload</button>
      </div>
    </div>

    <!-- Camera card: aspect-ratio 3/4 matches the phone's actual portrait sensor output
         (640x480 capture, rotated) - object-fit:contain equivalent (no "cover" crop) so the
         full field of view is always visible, never zoomed/cropped. -->
    <div style="background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius:var(--radius-sm); background:#000; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;">
        <div style="aspect-ratio:3/4; height:100%; max-width:100%; background:#0a0a0c center/contain no-repeat; display:flex; align-items:center; justify-content:center;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3a3d42" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
            <circle cx="12" cy="13" r="3.5"/>
          </svg>
        </div>
        <span style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.55); color:var(--text-dim); font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px;">LIVE</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button style="background:var(--accent); color:var(--accent-text); border:none; border-radius:var(--radius-sm); padding:10px 0; font-size:12.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.2"/></svg>
          Camera On
        </button>
        <button style="background:var(--panel-2); color:var(--text); border:1px solid var(--panel-border); border-radius:var(--radius-sm); padding:10px 0; font-size:12.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
          Flashlight
        </button>
      </div>
    </div>
  </div>

  <div style="text-align:center; font-size:10.5px; color:var(--text-faint);">Marlin V1.0.6 &middot; Ender-3 V3 SE</div>

</div>
</x-dc>
</body>
</html>
