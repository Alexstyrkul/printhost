; PrintHost ESP32-S3 bridge firmware (bring-up: camera + SD self-test).
; Board: ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB octal PSRAM), flashed over the UART USB-C port.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

; Same firmware built with Arduino as an ESP-IDF component so lwIP/Wi-Fi buffers can be tuned
; (stock Arduino builds ship a ~5.7 KB TCP window, which throttles MJPEG). See sdkconfig.defaults.
[env:esp32s3_tuned]
extends = env:esp32s3
framework = arduino, espidf

; Over-the-air flashing: pio run -e esp32s3_ota -t upload  (needs PRINTHOST_OTA_PASS = OTA_PASS from src/secrets.h)
[env:esp32s3_ota]
extends = env:esp32s3_tuned
upload_protocol = espota
upload_port = 192.168.50.190
upload_flags = --auth=${sysenv.PRINTHOST_OTA_PASS}
